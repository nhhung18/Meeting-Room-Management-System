# Chạy toàn bộ hệ thống: `docker compose up --build`
# Biến ${...} lấy từ file .env ở thư mục gốc (copy từ .env.example).

name: mrms

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Thiếu POSTGRES_USER trong .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong .env}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:?Thiếu BOOKING_DB_PASSWORD trong .env}
      ROOM_DB_PASSWORD: ${ROOM_DB_PASSWORD:?Thiếu ROOM_DB_PASSWORD trong .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # Không mở port ra ngoài: chỉ các service trong mạng Docker mới gọi được DB.
    # Muốn xem DB bằng công cụ trên máy thì tạm bỏ comment dòng dưới.
    # ports: ["5432:5432"]

  booking-service:
    build:
      context: .
      dockerfile: services/booking-service/Dockerfile
    environment:
      SERVICE_NAME: booking-service
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://booking_user:${BOOKING_DB_PASSWORD}@postgres:5432/booking_db
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # Dùng 127.0.0.1 (IPv4) thay vì localhost: trong image alpine, localhost
      # có thể resolve ra IPv6 ::1 trong khi uvicorn chỉ listen IPv4 -> healthcheck fail.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  room-service:
    build:
      context: .
      dockerfile: services/room-service/Dockerfile
    environment:
      SERVICE_NAME: room-service
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://room_user:${ROOM_DB_PASSWORD}@postgres:5432/room_db
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  auto-cancel-worker:
    build:
      context: .
      dockerfile: services/booking-service/Dockerfile
    command: python -m app.workers.auto_cancel
    environment:
      SERVICE_NAME: auto-cancel-worker
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://booking_user:${BOOKING_DB_PASSWORD}@postgres:5432/booking_db
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      AUTO_CANCEL_INTERVAL_SECONDS: ${AUTO_CANCEL_INTERVAL_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  outbox-relay:
    build:
      context: .
      dockerfile: services/booking-service/Dockerfile
    command: python -m app.workers.outbox_relay
    environment:
      SERVICE_NAME: outbox-relay
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://booking_user:${BOOKING_DB_PASSWORD}@postgres:5432/booking_db
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      OUTBOX_RELAY_INTERVAL_SECONDS: ${OUTBOX_RELAY_INTERVAL_SECONDS:-5}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      # Management UI: http://localhost:15672 (guest/guest khi local)
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    # Không mở AMQP port ra ngoài: chỉ services trong Docker network gọi được.
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  notification-worker:
    build:
      context: .
      dockerfile: services/notification-worker/Dockerfile
    environment:
      SERVICE_NAME: notification-worker
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@mrms.local}
      DATABASE_URL: postgresql+psycopg://booking_user:${BOOKING_DB_PASSWORD}@postgres:5432/booking_db
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      booking-service:
        condition: service_healthy
      room-service:
        condition: service_healthy
      notification-worker:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 thay cho localhost: tránh localhost -> IPv6 ::1 trong alpine
      # khi Nginx chỉ listen IPv4 (xem docker-compose booking-service ở trên).
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
