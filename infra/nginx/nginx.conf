# Nginx đóng vai trò API Gateway (ADR-0001): routing + load balancing + rate limiting.
# Chạy 2 instance booking-service: docker compose up --scale booking-service=2
# Docker DNS (127.0.0.11) round-robin giữa các instance khi re-resolve.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Giữ X-Request-ID nếu client đã gửi, ngược lại dùng ID ngẫu nhiên do Nginx sinh.
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    # 127.0.0.11 là DNS resolver nội bộ của Docker.
    # valid=1s: re-resolve mỗi giây → round-robin giữa nhiều instance booking-service.
    resolver 127.0.0.11 valid=1s;

    # Rate limiting: tối đa 20 req/s mỗi IP client; zone 10MB ~ 160k IPs.
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;

    # Access log dạng JSON, cùng định dạng với log của các service.
    log_format json escape=json
        '{"timestamp":"$time_iso8601","service":"nginx","request_id":"$req_id",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"duration_s":$request_time,"upstream":"$upstream_addr"}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    server {
        listen 80;
        server_tokens off;

        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"nginx"}';
        }

        location /api/bookings/ {
            # Dùng biến để buộc nginx re-resolve hostname mỗi request.
            # Khi scale booking-service=2, Docker DNS round-robin giữa 2 instance.
            set $booking http://booking-service:8000;
            limit_req zone=api_per_ip burst=40 nodelay;
            limit_req_status 429;
            proxy_pass $booking;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $req_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/rooms/ {
            set $room_service http://room-service:8000;
            limit_req zone=api_per_ip burst=40 nodelay;
            limit_req_status 429;
            proxy_pass $room_service;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $req_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/notifications/ {
            set $notification_worker http://notification-worker:8000;
            limit_req zone=api_per_ip burst=40 nodelay;
            limit_req_status 429;
            proxy_pass $notification_worker;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $req_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Mọi đường dẫn chưa có service xử lý.
        location / {
            default_type application/json;
            return 404 '{"detail":"Not Found"}';
        }
    }
}
