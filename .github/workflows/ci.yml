name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libs-common:
    name: libs/common · kiểm tra + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/common
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: libs/common/pyproject.toml
      - run: pip install -e ".[dev]" 2>/dev/null || pip install -e . && pip install pytest ruff
      - name: Lint
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/
      - name: Test
        run: python -m pytest -v

  booking-service:
    name: booking-service · kiểm tra + test
    needs: libs-common
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/booking-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/booking-service/requirements*.txt
      - name: Cài libs/common
        run: pip install -e libs/common
        working-directory: .
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit test
        run: python -m pytest

  room-service:
    name: room-service · kiểm tra + test
    needs: libs-common
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/room-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/room-service/requirements*.txt
      - name: Cài libs/common
        run: pip install -e libs/common
        working-directory: .
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check app/ tests/
          ruff format --check app/ tests/
      - name: Unit test
        run: python -m pytest -v

  notification-worker:
    name: notification-worker · kiểm tra + test
    needs: libs-common
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notification-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/notification-worker/requirements*.txt
      - name: Cài libs/common
        run: pip install -e libs/common
        working-directory: .
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check app/ tests/
          ruff format --check app/ tests/
      - name: Unit test
        run: python -m pytest -v

  smoke-test:
    name: docker compose · kiểm tra smoke
    needs: [booking-service, room-service, notification-worker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tạo .env từ mẫu
        run: cp .env.example .env
      - name: Build và chạy toàn bộ hệ thống
        run: docker compose up --build -d --wait
      - name: Gọi API qua Nginx
        run: |
          curl --fail --silent --show-error http://localhost:8080/health
          curl --fail --silent --show-error http://localhost:8080/api/bookings/health
      - name: Kiểm tra room-service và notification-worker health
        run: |
          curl --fail --silent --show-error http://localhost:8080/api/rooms/health
          curl --fail --silent --show-error http://localhost:8080/api/notifications/health
      - name: Log khi lỗi
        if: failure()
        run: docker compose logs
      - name: Dọn dẹp
        if: always()
        run: docker compose down -v
